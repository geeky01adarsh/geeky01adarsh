<text x="360" y="110" text-anchor="middle" fill="#9aa4bf" font-family="ui-monospace, JetBrains Mono, monospace" font-size="8">research</text>
  <text x="360" y="120" text-anchor="middle" fill="#9aa4bf" font-family="ui-monospace, JetBrains Mono, monospace" font-size="8">ship &#183; scale</text>
