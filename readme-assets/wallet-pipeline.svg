<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" role="img" aria-label="Wallet pipeline from client to Canton ledger">
  <defs>
    <linearGradient id="wp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f23"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="wp-arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#fdc50f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="120" rx="12" fill="url(#wp-bg)"/>
  <rect x="1" y="1" width="638" height="118" rx="11" fill="none" stroke="#fdc50f" stroke-opacity="0.2"/>
  <text x="320" y="26" text-anchor="middle" fill="#94a3bf" font-family="ui-monospace, JetBrains Mono, monospace" font-size="10">Zoro-style path (simplified)</text>
  <g font-family="ui-monospace, JetBrains Mono, monospace">
    <rect x="32" y="44" width="140" height="52" rx="8" fill="#13162a" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="102" y="68" text-anchor="middle" fill="#eef1ff" font-size="10" font-weight="600">Client</text>
    <text x="102" y="84" text-anchor="middle" fill="#9aa4bf" font-size="8">RN &#183; Expo &#183; Web</text>
    <polygon points="198,58 212,70 198,82" fill="url(#wp-arrow)"/>
    <rect x="220" y="44" width="150" height="52" rx="8" fill="#13162a" stroke="#fdc50f" stroke-width="1.2"/>
    <text x="295" y="68" text-anchor="middle" fill="#eef1ff" font-size="10" font-weight="600">APIs</text>
    <text x="295" y="84" text-anchor="middle" fill="#9aa4bf" font-size="8">Node &#183; Koa &#183; queues</text>
    <polygon points="386,58 400,70 386,82" fill="url(#wp-arrow)"/>
    <rect x="408" y="44" width="200" height="52" rx="8" fill="#13162a" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="508" y="68" text-anchor="middle" fill="#eef1ff" font-size="10" font-weight="600">Canton ledger</text>
    <text x="508" y="84" text-anchor="middle" fill="#9aa4bf" font-size="8">DAML &#183; validators &#183; rewards</text>
  </g>
</svg>
