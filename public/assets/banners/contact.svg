<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" role="img" aria-label="Contact  collaborate on Web3 and systems work">
  <defs>
    <linearGradient id="ct-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1238"/>
      <stop offset="1" stop-color="#1a0e36"/>
    </linearGradient>
    <radialGradient id="ct-glowL" cx="0.2" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ct-glowR" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdc50f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fdc50f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ct-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ef9ff"/>
      <stop offset="1" stop-color="#fdc50f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="320" fill="url(#ct-bg)"/>
  <rect width="1600" height="320" fill="url(#ct-glowL)"/>
  <rect width="1600" height="320" fill="url(#ct-glowR)"/>

  <!-- mesh -->
  <g stroke="#a78bfa" stroke-opacity="0.18" fill="none" stroke-width="1">
    <path d="M 100 220 L 240 140 L 380 200 L 520 110 L 660 180 L 800 100 L 940 180 L 1080 110 L 1220 200 L 1360 140 L 1500 220"/>
    <path d="M 100 100 L 240 220 L 380 140 L 520 220 L 660 120 L 800 220 L 940 120 L 1080 220 L 1220 120 L 1360 220 L 1500 100"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="100" cy="220" r="3"/>
    <circle cx="240" cy="140" r="3"/>
    <circle cx="380" cy="200" r="3"/>
    <circle cx="520" cy="110" r="3"/>
    <circle cx="660" cy="180" r="3"/>
    <circle cx="800" cy="100" r="3"/>
    <circle cx="940" cy="180" r="3"/>
    <circle cx="1080" cy="110" r="3"/>
    <circle cx="1220" cy="200" r="3"/>
    <circle cx="1360" cy="140" r="3"/>
    <circle cx="1500" cy="220" r="3"/>
  </g>

  <!-- handshake line -->
  <path d="M 280 160 L 760 160" stroke="url(#ct-line)" stroke-width="3" stroke-dasharray="10 8" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M 840 160 L 1320 160" stroke="url(#ct-line)" stroke-width="3" stroke-dasharray="10 8" fill="none">
    <animate attributeName="stroke-dashoffset" from="-36" to="0" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- nodes anchor -->
  <g>
    <circle cx="280" cy="160" r="22" fill="#0f1735" stroke="#8ef9ff" stroke-width="2"/>
    <text x="280" y="166" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#8ef9ff" text-anchor="middle">YOU</text>
    <circle cx="1320" cy="160" r="22" fill="#0f1735" stroke="#fdc50f" stroke-width="2"/>
    <text x="1320" y="166" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#fdc50f" text-anchor="middle">ME</text>
  </g>

  <!-- center hex with check -->
  <g transform="translate(800 160)">
    <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="#0f1735" stroke="#a78bfa" stroke-width="2"/>
    <path d="M -8 0 L -2 6 L 10 -8" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, monospace" fill="#9aa4bf" font-size="13">
    <text x="280" y="226" text-anchor="middle">build � ship � scale</text>
    <text x="1320" y="226" text-anchor="middle">web3 � systems � backend</text>
  </g>
